  <!--
    Title only. Every route in this app sets its own <title> and full
    Open Graph / description block via react-helmet-async — and Helmet
    can only manage tags it rendered itself, it can't see or remove
    hand-written static tags here. Static og:* / description tags used
    to live here as a "fallback", but that meant every single page
    shipped BOTH the generic homepage tags AND the page-specific ones
    at once (two og:url, two og:image, two descriptions) — a real
    duplicate-content signal to Google and to social link previews.
    <title> is safe to keep: it's a singleton DOM property, so Helmet's
    document.title assignment cleanly replaces this instead of doubling.
  -->
  <title>StudentToolsNG - Free CGPA, WAEC &amp; JAMB Calculators for Nigerian Students</title>
